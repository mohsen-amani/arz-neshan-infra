name: Validate deployment model

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate deployment model
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out infrastructure
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.7 -color

      - name: Validate services, images, and release metadata
        run: node scripts/validate-deployment.mjs
