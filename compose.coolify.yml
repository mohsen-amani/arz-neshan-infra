name: arz-neshan
# The default deployment contains the API and its private ClamAV dependency.
# Web and platform remain dormant until the `frontends` profile is enabled.
# Database migrations run only through the explicit `migration` profile.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
x-database-environment: &database-environment
  DATABASE_HOST: "${DATABASE_HOST:?DATABASE_HOST is required}"
  DATABASE_PORT: "${DATABASE_PORT:-5432}"
  DATABASE_USER: "${DATABASE_USER:?DATABASE_USER is required}"
  DATABASE_PASS: "${DATABASE_PASS:?DATABASE_PASS is required}"
  DATABASE_NAME: "${DATABASE_NAME:?DATABASE_NAME is required}"
x-api-environment: &api-environment
  DATABASE_HOST: "${DATABASE_HOST:?DATABASE_HOST is required}"
  DATABASE_PORT: "${DATABASE_PORT:-5432}"
  DATABASE_USER: "${DATABASE_USER:?DATABASE_USER is required}"
  DATABASE_PASS: "${DATABASE_PASS:?DATABASE_PASS is required}"
  DATABASE_NAME: "${DATABASE_NAME:?DATABASE_NAME is required}"
  NODE_ENV: production
  PORT: "3000"
  APP_NAME: "${APP_NAME:-Arz Neshan}"
  FRONT_APP_URL: "${FRONT_APP_URL:?FRONT_APP_URL is required}"
  CLIENT_APP_URL: "${CLIENT_APP_URL:?CLIENT_APP_URL is required}"
  ADMIN_BASE_DOMAIN: "${ADMIN_BASE_DOMAIN:?ADMIN_BASE_DOMAIN is required}"
  CLIENT_BASE_DOMAIN: "${CLIENT_BASE_DOMAIN:?CLIENT_BASE_DOMAIN is required}"
  PUBLIC_APP_URL: "${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}"
  FRONT_RESET_PASSWORD_PATH: "${FRONT_RESET_PASSWORD_PATH:-/auth/reset-password}"
  CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
  TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-2}"
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
  JWT_AUDIENCE: "${JWT_AUDIENCE:-arz-neshan-api}"
  JWT_ISSUER: "${JWT_ISSUER:-arz-neshan}"
  JWT_ACCESS_TOKEN_TTL: "${JWT_ACCESS_TOKEN_TTL:-15m}"
  AUTH_SESSION_TTL: "${AUTH_SESSION_TTL:-30d}"
  AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
  RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-1m}"
  RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS:-100}"
  RESET_PASSWORD_TOKEN_TTL: "${RESET_PASSWORD_TOKEN_TTL:-15m}"
  RESET_PASSWORD_OTP_PEPPER: "${RESET_PASSWORD_OTP_PEPPER:?RESET_PASSWORD_OTP_PEPPER is required}"
  TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}"
  OTP_DEV_ECHO: "false"
  OTP_LOG_MODE: "false"
  SMS_GATEWAY_URL: "${SMS_GATEWAY_URL:?SMS_GATEWAY_URL is required}"
  SMS_GATEWAY_KEY_ID: "${SMS_GATEWAY_KEY_ID:-arz-neshan-api}"
  SMS_GATEWAY_SECRET: "${SMS_GATEWAY_SECRET:?SMS_GATEWAY_SECRET is required}"
  SMS_GATEWAY_DISABLED: "false"
  INTERNAL_JOBS_TOKEN: "${INTERNAL_JOBS_TOKEN:?INTERNAL_JOBS_TOKEN is required}"
  HESABPAY_API_URL: "${HESABPAY_API_URL:-https://api.hesab.com}"
  HESABPAY_API_KEY: "${HESABPAY_API_KEY:?HESABPAY_API_KEY is required}"
  HESABPAY_MOCK_MODE: "false"
  PLATFORM_OWNER_EMAIL: "${PLATFORM_OWNER_EMAIL:-}"
  PLATFORM_OWNER_PASSWORD: "${PLATFORM_OWNER_PASSWORD:-}"
  PLATFORM_OWNER_TOTP_SECRET: "${PLATFORM_OWNER_TOTP_SECRET:-}"
  MAIL_HOST: "${MAIL_HOST:?MAIL_HOST is required}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USER: "${MAIL_USER:?MAIL_USER is required}"
  MAIL_PASS: "${MAIL_PASS:?MAIL_PASS is required}"
  MAIL_SECURE: "${MAIL_SECURE:-false}"
  MAIL_REQUIRE_TLS: "${MAIL_REQUIRE_TLS:-true}"
  MAIL_TLS_SERVERNAME: "${MAIL_TLS_SERVERNAME:-}"
  MAIL_FROM: "${MAIL_FROM:?MAIL_FROM is required}"
  MAIL_SUPPORT: "${MAIL_SUPPORT:-}"
  ATTACHMENT_STORAGE_DRIVER: "${ATTACHMENT_STORAGE_DRIVER:-local}"
  ATTACHMENT_LOCAL_ROOT: /app/data/attachments
  ATTACHMENT_MAX_BYTES: "${ATTACHMENT_MAX_BYTES:-10485760}"
  ATTACHMENT_AV_ENABLED: "true"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  CLAMAV_TIMEOUT_MS: "${CLAMAV_TIMEOUT_MS:-15000}"
  ATTACHMENT_S3_ENDPOINT: "${ATTACHMENT_S3_ENDPOINT:-}"
  ATTACHMENT_S3_REGION: "${ATTACHMENT_S3_REGION:-us-east-1}"
  ATTACHMENT_S3_BUCKET: "${ATTACHMENT_S3_BUCKET:-}"
  ATTACHMENT_S3_ACCESS_KEY_ID: "${ATTACHMENT_S3_ACCESS_KEY_ID:-}"
  ATTACHMENT_S3_SECRET_ACCESS_KEY: "${ATTACHMENT_S3_SECRET_ACCESS_KEY:-}"
  ATTACHMENT_S3_FORCE_PATH_STYLE: "${ATTACHMENT_S3_FORCE_PATH_STYLE:-true}"
  ATTACHMENT_S3_CA_CERT: "${ATTACHMENT_S3_CA_CERT:-}"
  ATTACHMENT_ENCRYPTION_SCHEME: vault_transit_aes_256_gcm
  VAULT_ADDR: "${VAULT_ADDR:?VAULT_ADDR is required}"
  VAULT_NAMESPACE: "${VAULT_NAMESPACE:-}"
  VAULT_TOKEN_FILE: /run/secrets/vault/token
  VAULT_TRANSIT_MOUNT: "${VAULT_TRANSIT_MOUNT:-transit}"
  VAULT_TRANSIT_KEY: "${VAULT_TRANSIT_KEY:-arz-neshan-attachments}"
  VAULT_CA_CERT: "${VAULT_CA_CERT:-}"
  VAULT_TIMEOUT_MS: "${VAULT_TIMEOUT_MS:-5000}"

services:
  vault-agent:
    image: "${VAULT_AGENT_IMAGE:?VAULT_AGENT_IMAGE is required}"
    pull_policy: always
    user: "10001:10001"
    init: true
    restart: unless-stopped
    # Docker Compose materializes environment-backed secrets in the container
    # root filesystem, so this service cannot use read_only. It remains
    # unprivileged, capability-free, and isolated from public traffic.
    command: ["agent", "-config=/vault/config/agent.hcl"]
    environment:
      VAULT_ADDR: "${VAULT_ADDR:?VAULT_ADDR is required}"
      VAULT_NAMESPACE: "${VAULT_NAMESPACE:-}"
    secrets:
      - vault_role_id
      - vault_secret_id
    configs:
      - source: vault_agent_config
        target: /vault/config/agent.hcl
        uid: "10001"
        gid: "10001"
        mode: 0440
    volumes:
      - type: volume
        source: vault_agent_token
        target: /vault/token
        volume:
          nocopy: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "test -s /vault/token/token"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  clamav:
    image: "${CLAMAV_IMAGE:-clamav/clamav:1.4.5_base}"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - clamav_database:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
  migration:
    image: "regi.mohsenamani.com/arz-neshan/api:sha-5c4a0b43d09e87341132a29b29173ae1d5a279f9"
    profiles: [migration]
    pull_policy: always
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    environment: *database-environment
    command: ["npm", "run", "migration:run:prod"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
  api:
    image: "regi.mohsenamani.com/arz-neshan/api:sha-5c4a0b43d09e87341132a29b29173ae1d5a279f9"
    pull_policy: always
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    environment: *api-environment
    volumes:
      - attachments_data:/app/data/attachments
      - type: volume
        source: vault_agent_token
        target: /run/secrets/vault
        read_only: true
        volume:
          nocopy: true
    expose:
      - "3000"
    depends_on:
      vault-agent:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
  web:
    profiles: [frontends]
    image: "regi.mohsenamani.com/arz-neshan/web:sha-f5f78145f9586b04288eba9a349dc1fc411a5da2"
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    environment:
      ADMIN_BASE_DOMAIN: "${ADMIN_BASE_DOMAIN:?ADMIN_BASE_DOMAIN is required}"
    tmpfs:
      - /config:size=16m,noexec,nosuid
      - /data:size=16m,noexec,nosuid
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck: &frontend-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
  platform:
    profiles: [frontends]
    image: "regi.mohsenamani.com/arz-neshan/platform:sha-f5f78145f9586b04288eba9a349dc1fc411a5da2"
    pull_policy: always
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    environment:
      API_UPSTREAM: api:3000
    tmpfs:
      - /config:size=16m,noexec,nosuid
      - /data:size=16m,noexec,nosuid
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *frontend-healthcheck
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
volumes:
  attachments_data:
  clamav_database:
  vault_agent_token:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=10001,gid=10001,mode=0700

configs:
  vault_agent_config:
    content: |
      exit_after_auth = false
      pid_file        = "/tmp/vault-agent.pid"

      auto_auth {
        method {
          type       = "approle"
          mount_path = "auth/approle"

          config = {
            role_id_file_path                   = "/run/secrets/vault_role_id"
            secret_id_file_path                 = "/run/secrets/vault_secret_id"
            remove_secret_id_file_after_reading = false
          }
        }

        sink "file" {
          config = {
            path  = "/vault/token/token"
            mode  = 0440
            owner = 10001
            group = 10001
          }
        }
      }

secrets:
  vault_role_id:
    environment: VAULT_ROLE_ID
  vault_secret_id:
    environment: VAULT_SECRET_ID
